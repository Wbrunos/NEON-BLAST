<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON BLAST - Viciante & Pro</title>
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const err = `Error: ${msg}\nLine: ${lineNo}\nFile: ${url}`;
      console.error(err);
      const errorDiv = document.createElement('div');
      errorDiv.style = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:9999;font-family:monospace;word-break:break-all;';
      errorDiv.innerHTML = err.replace(/\n/g, '<br>');
      if (document.body) document.body.appendChild(errorDiv);
      return false;
    };
  </script>
  <script>
    function loadFallback(src) {
      const script = document.createElement('script');
      script.src = src; script.crossOrigin = "anonymous";
      document.head.appendChild(script);
    }
  </script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" onerror="loadFallback('/react.min.js')"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" onerror="loadFallback('/react-dom.min.js')"></script>
  <style>
    :root {
      --bg: #050505;
      --card-bg: rgba(20, 20, 30, 0.85);
      --accent: #00f2ff;
      --success: #00ff88;
      --danger: #ff0055;
      --warning: #ffaa00;
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      font-family: 'Outfit', 'Inter', -apple-system, sans-serif; 
      background: var(--bg); 
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
    }

    .app-container {
      max-width: 1200px; margin: 0 auto; padding: 15px;
      display: flex; flex-direction: column; gap: 15px; align-items: center;
    }

    @media (min-width: 1024px) {
      .app-container { flex-direction: row; align-items: flex-start; justify-content: center; padding-top: 40px; }
    }

    .game-panel {
      background: var(--card-bg); backdrop-filter: blur(15px);
      border: 1px solid var(--border); border-radius: 32px;
      padding: 24px; width: 100%; max-width: 450px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: relative;
    }

    .game-header { text-align: center; margin-bottom: 20px; }
    .game-header h1 {
      font-size: 32px; font-weight: 900;
      background: linear-gradient(to right, var(--accent), #7000ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -2px; text-transform: uppercase;
    }

    .canvas-container { position: relative; margin: 0 auto; display: flex; justify-content: center; }
    canvas {
      display: block; border-radius: 20px; background: rgba(0,0,0,0.4);
      border: 2px solid var(--border); box-shadow: 0 0 30px rgba(0, 242, 255, 0.15);
      touch-action: none;
    }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
    .stat-card {
      background: var(--glass); padding: 12px; border-radius: 20px;
      text-align: center; border: 1px solid var(--border);
    }
    .stat-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .stat-value { font-size: 22px; font-weight: 900; margin-top: 4px; }
    .score-value { color: var(--success); text-shadow: 0 0 10px rgba(0, 255, 136, 0.5); }
    .moves-value { color: var(--warning); text-shadow: 0 0 10px rgba(255, 170, 0, 0.5); }

    .dashboard-panel { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
    .glass-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 24px; padding: 20px; }

    .streak-banner {
      background: linear-gradient(135deg, #ff0080 0%, #7928ca 100%);
      padding: 20px; border-radius: 24px; text-align: center;
      box-shadow: 0 10px 20px rgba(255, 0, 128, 0.3);
      animation: glowPulse 2s infinite ease-in-out;
    }
    @keyframes glowPulse {
      0% { box-shadow: 0 10px 20px rgba(255, 0, 128, 0.3); }
      50% { box-shadow: 0 10px 40px rgba(255, 0, 128, 0.6); }
      100% { box-shadow: 0 10px 20px rgba(255, 0, 128, 0.3); }
    }

    .streak-number { font-size: 48px; font-weight: 900; }
    .streak-text { font-size: 14px; opacity: 0.9; font-weight: 700; letter-spacing: 1px; }

    .leaderboard-item {
      display: flex; justify-content: space-between; padding: 10px;
      border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .leaderboard-item:last-child { border: none; }
    .rank { font-weight: 900; color: var(--accent); margin-right: 10px; }
    .user-id { flex: 1; color: #ccc; }
    .score-pts { font-weight: 700; color: var(--success); }

    button {
      background: linear-gradient(to right, #2563eb, #7c3aed);
      color: white; border: none; padding: 18px; border-radius: 20px;
      font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }
    button:active { transform: scale(0.95); }
    button.secondary { background: var(--glass); border: 1px solid var(--border); box-shadow: none; color: #aaa; }
    button.ad-btn { background: linear-gradient(to right, #f59e0b, #d97706); color: #000; margin-top: 10px; font-size: 14px; }

    .toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 30px; border-radius: 24px; z-index: 100; text-align: center;
      font-size: 24px; font-weight: 900; text-transform: uppercase;
      backdrop-filter: blur(20px); border: 2px solid #fff;
    }

    @media (max-width: 480px) {
      .game-panel { padding: 20px; border-radius: 0; border: none; max-width: none; background: #000; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 24px; color: #fff;">
      CARREGANDO NEON BLAST...
    </div>
  </div>

  <script>
    const h = React.createElement;
    const { useState, useEffect, useRef, useCallback } = React;

    const COLORS = [
      { main: '#ff3d00', glow: 'rgba(255, 61, 0, 0.6)' },
      { main: '#00e5ff', glow: 'rgba(0, 229, 255, 0.6)' },
      { main: '#ffea00', glow: 'rgba(255, 234, 0, 0.6)' },
      { main: '#d500f9', glow: 'rgba(213, 0, 249, 0.6)' },
      { main: '#00e676', glow: 'rgba(0, 230, 118, 0.6)' }
    ];

    const GRID_SIZE = 5;
    const BLOCK_SIZE = 70;
    const CANVAS_SIZE = GRID_SIZE * BLOCK_SIZE + 20;

    const PHASES = Array.from({ length: 100 }, (_, i) => ({
      level: i + 1,
      moves: Math.max(6, 25 - Math.floor(i / 2)),
      target: 500 + (i * 800)
    }));

    class GameAudio {
      constructor() { this.ctx = null; this.enabled = true; }
      init() { 
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playNote(freq, type, decay, vol = 0.2) {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + decay);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + decay);
      }
      playSwap() { this.playNote(300, 'sine', 0.1, 0.1); }
      playMatch(combo = 0) { 
        const base = 400 + (combo * 150);
        this.playNote(base, 'triangle', 0.3); 
        setTimeout(() => this.playNote(base * 1.5, 'triangle', 0.2), 60);
      }
      playLevelUp() { 
        [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => this.playNote(f, 'sine', 0.6, 0.3), i * 150)); 
      }
      playFail() { this.playNote(100, 'sawtooth', 0.5, 0.4); }
    }

    const audio = new GameAudio();

    function GameCanvas({ grid, onSwap, gameState, combo }) {
      const canvasRef = useRef(null);
      const [selected, setSelected] = useState(null);
      const [shake, setShake] = useState(0);

      useEffect(() => { if (combo > 0) setShake(15); }, [combo]);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let frame;
        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (shake > 0) {
            ctx.save();
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
            setShake(s => Math.max(0, s - 1.5));
          }

          grid.forEach((block, i) => {
            const x = (i % GRID_SIZE) * BLOCK_SIZE + 10;
            const y = Math.floor(i / GRID_SIZE) * BLOCK_SIZE + 10;
            const colorObj = COLORS.find(c => c.main === block.color) || COLORS[0];
            
            ctx.shadowBlur = 20; ctx.shadowColor = colorObj.glow;
            ctx.fillStyle = colorObj.main;
            const p = 8; const r = 16;
            const bx = x + p; const by = y + p;
            const bw = BLOCK_SIZE - p * 2; const bh = BLOCK_SIZE - p * 2;

            ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, r); ctx.fill();
            
            // Neon edge
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
            ctx.stroke();

            if (selected && selected.idx === i) {
              ctx.shadowBlur = 30; ctx.shadowColor = '#fff';
              ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
              ctx.strokeRect(bx - 4, by - 4, bw + 8, bh + 8);
            }
          });

          if (shake > 0) ctx.restore();
          frame = requestAnimationFrame(render);
        };
        render(); return () => cancelAnimationFrame(frame);
      }, [grid, selected, shake]);

      const handleTouch = (e) => {
        audio.init();
        if (gameState.gameOver) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const clientX = e.clientX || e.touches[0].clientX;
        const clientY = e.clientY || e.touches[0].clientY;
        const x = Math.floor((clientX - rect.left - 10) / BLOCK_SIZE);
        const y = Math.floor((clientY - rect.top - 10) / BLOCK_SIZE);
        const idx = y * GRID_SIZE + x;
        if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return;
        
        if (selected) {
          const dist = Math.abs(selected.x - x) + Math.abs(selected.y - y);
          if (dist === 1) { onSwap(selected.idx, idx); setSelected(null); }
          else { setSelected({ x, y, idx }); audio.playSwap(); }
        } else { 
          setSelected({ x, y, idx }); audio.playSwap();
        }
      };

      return h('canvas', { 
        ref: canvasRef, width: CANVAS_SIZE, height: CANVAS_SIZE, 
        onMouseDown: handleTouch, onTouchStart: handleTouch 
      });
    }

    function App() {
      const [gameState, setGameState] = useState(() => {
        const saved = localStorage.getItem('neonblast_game_v2');
        return saved ? JSON.parse(saved) : {
          phase: 1, score: 0, moves: PHASES[0].moves,
          grid: Array(25).fill(0).map(() => ({ color: COLORS[Math.floor(Math.random() * COLORS.length)].main })),
          gameOver: false, sessionStart: Date.now()
        };
      });

      const [metrics, setMetrics] = useState(() => {
        const saved = localStorage.getItem('neonblast_metrics_v2');
        return saved ? JSON.parse(saved) : { totalScore: 0, dailyStreak: 0, lastPlayDate: null };
      });

      const [leaderboard, setLeaderboard] = useState([]);
      const [combo, setCombo] = useState(0);
      const [showWin, setShowWin] = useState(false);
      const [showHelp, setShowHelp] = useState(false);

      useEffect(() => { localStorage.setItem('neonblast_game_v2', JSON.stringify(gameState)); }, [gameState]);
      useEffect(() => { localStorage.setItem('neonblast_metrics_v2', JSON.stringify(metrics)); }, [metrics]);

      const fetchLeaderboard = async () => {
        try {
          const res = await fetch('/api/leaderboard');
          const data = await res.json();
          if (Array.isArray(data)) setLeaderboard(data);
        } catch (e) {}
      };

      useEffect(() => { 
        fetchLeaderboard();
        const today = new Date().toDateString();
        if (metrics.lastPlayDate !== today) {
          const yesterday = new Date(Date.now() - 86400000).toDateString();
          let newStr = metrics.lastPlayDate === yesterday ? metrics.dailyStreak + 1 : 1;
          setMetrics(m => ({ ...m, dailyStreak: newStr, lastPlayDate: today }));
        }
      }, []);

      const handleSwap = (idx1, idx2) => {
        if (gameState.moves <= 0 || gameState.gameOver) return;
        const newGrid = [...gameState.grid];
        [newGrid[idx1], newGrid[idx2]] = [newGrid[idx2], newGrid[idx1]];
        
        let currentCombo = 0; let matched = true; let totalMatched = 0;
        while (matched) {
          matched = false; const toRemove = new Set();
          for (let i = 0; i < 25; i++) {
            const r = Math.floor(i / GRID_SIZE); const c = i % GRID_SIZE;
            if (c <= GRID_SIZE - 3 && newGrid[i].color === newGrid[i+1].color && newGrid[i].color === newGrid[i+2].color) [i, i+1, i+2].forEach(idx => toRemove.add(idx));
            if (r <= GRID_SIZE - 3 && newGrid[i].color === newGrid[i+GRID_SIZE].color && newGrid[i].color === newGrid[i+GRID_SIZE*2].color) [i, i+GRID_SIZE, i+GRID_SIZE*2].forEach(idx => toRemove.add(idx));
          }
          if (toRemove.size > 0) {
            matched = true; currentCombo++; totalMatched += toRemove.size; 
            audio.playMatch(currentCombo);
            toRemove.forEach(idx => newGrid[idx] = null);
            for (let c = 0; c < GRID_SIZE; c++) {
              const column = []; for (let r = 0; r < GRID_SIZE; r++) if (newGrid[r * GRID_SIZE + c]) column.push(newGrid[r * GRID_SIZE + c]);
              while (column.length < GRID_SIZE) column.unshift({ color: COLORS[Math.floor(Math.random() * COLORS.length)].main });
              for (let r = 0; r < GRID_SIZE; r++) newGrid[r * GRID_SIZE + c] = column[r];
            }
          }
        }
        
        if (totalMatched === 0) {
          [newGrid[idx1], newGrid[idx2]] = [newGrid[idx2], newGrid[idx1]];
          return;
        }

        const newScore = gameState.score + (totalMatched * 10 * currentCombo);
        const newMoves = gameState.moves - 1;
        const target = PHASES[gameState.phase - 1].target;
        
        let gameOver = false;
        if (newScore >= target) { 
          gameOver = 'won'; audio.playLevelUp(); setShowWin(true); 
          setMetrics(m => ({ ...m, totalScore: m.totalScore + newScore }));
        } else if (newMoves <= 0) { gameOver = 'lost'; audio.playFail(); }
        
        setCombo(currentCombo);
        setGameState(prev => ({ ...prev, grid: newGrid, score: newScore, moves: newMoves, gameOver }));
        if (gameOver) syncData(newScore, metrics.dailyStreak);
      };

      const syncData = async (score, streak) => {
        const userId = localStorage.getItem('user_id_v2') || 'Ninja_' + Math.random().toString(36).substr(2, 4).toUpperCase();
        localStorage.setItem('user_id_v2', userId);
        const payload = { 
          user_id: userId, phase_level: gameState.phase, score: score, 
          total_sessions: metrics.dailyStreak, total_score: metrics.totalScore + score,
          daily_streak: streak, session_time: (Date.now() - gameState.sessionStart) / 1000,
        };
        fetch('/api/save-game', { 
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload) 
        }).then(() => fetchLeaderboard()).catch(() => {});
      };

      const watchAd = () => {
        alert("Simulando Vídeo Recompensado... +5 Jogadas!");
        setGameState(g => ({ ...g, moves: g.moves + 5, gameOver: false }));
      };

      return h('div', { className: 'app-container' },
        h('div', { className: 'game-panel' },
          h('div', { className: 'game-header' }, h('h1', null, 'NEON BLAST')),
          h('div', { className: 'canvas-container' },
            h(GameCanvas, { grid: gameState.grid, onSwap: handleSwap, gameState, combo }),
            showWin && h('div', { className: 'toast', style: { background: 'var(--success)', color: '#000' } }, '🎯 Nível Completo!'),
            gameState.gameOver === 'lost' && h('div', { className: 'toast', style: { background: 'var(--danger)', color: '#fff' } }, '💀 Fim de Jogo')
          ),
          h('div', { className: 'stats-grid' },
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-label' }, 'Pontos'), h('div', { className: 'stat-value score-value' }, gameState.score)),
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-label' }, 'Vidas'), h('div', { className: 'stat-value moves-value' }, gameState.moves)),
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-label' }, 'Meta'), h('div', { className: 'stat-value' }, PHASES[gameState.phase - 1].target))
          ),
          h('div', { className: 'controls' },
            gameState.gameOver === 'won' ? h('button', { onClick: () => {
              const nextPh = gameState.phase + 1;
              setGameState({ phase: nextPh, score: 0, moves: PHASES[nextPh - 1].moves, grid: Array(25).fill(0).map(() => ({ color: COLORS[Math.floor(Math.random() * COLORS.length)].main })), gameOver: false, sessionStart: Date.now() });
              setShowWin(false);
            } }, 'PRÓXIMO NÍVEL →') : 
            h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
              h('button', { onClick: () => setGameState({ ...gameState, score: 0, moves: PHASES[gameState.phase - 1].moves, grid: Array(25).fill(0).map(() => ({ color: COLORS[Math.floor(Math.random() * COLORS.length)].main })), gameOver: false }), className: 'secondary' }, 'REINICIAR FASE'),
              gameState.gameOver === 'lost' && h('button', { onClick: watchAd, className: 'ad-btn' }, '📺 VER VÍDEO (+5 JOGADAS)')
            ),
            h('button', { onClick: () => setShowHelp(true), className: 'secondary', style: { marginTop: '10px' } }, '❓ COMO JOGAR')
          )
        ),
        showHelp && h('div', { 
          style: { position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.9)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' },
          onClick: () => setShowHelp(false)
        }, 
          h('div', { 
            className: 'glass-card', 
            style: { maxWidth: '400px', textAlign: 'center' },
            onClick: (e) => e.stopPropagation()
          },
            h('h2', { style: { marginBottom: '20px', color: 'var(--accent)' } }, 'COMO JOGAR'),
            h('div', { style: { textAlign: 'left', display: 'flex', flexDirection: 'column', gap: '15px', fontSize: '15px', color: '#ccc' } },
              h('p', null, '💎 Troque blocos adjacentes para alinhar 3 ou mais da mesma cor.'),
              h('p', null, '🔥 Alinhe 4 ou mais para ganhar bônus explosivos e combos!'),
              h('p', null, '🎯 Atinja a meta de pontos antes das "Vidas" acabarem.'),
              h('p', null, '📅 Jogue todo dia para aumentar sua Sequência de Fogo (Streak).'),
              h('p', null, '🏆 Suba no ranking global e torne-se o mestre do Neon!')
            ),
            h('button', { onClick: () => setShowHelp(false), style: { marginTop: '25px', width: '100%' } }, 'ENTENDI!')
          )
        ),
        h('div', { className: 'dashboard-panel' },
          h('div', { className: 'streak-banner' }, h('div', { className: 'streak-number' }, `🔥 ${metrics.dailyStreak}`), h('div', { className: 'streak-text' }, 'DIAS SEGUIDOS')),
          h('div', { className: 'glass-card' },
            h('h3', { style: { fontSize: '16px', color: 'var(--accent)', marginBottom: '15px', textAlign: 'center' } }, '🏆 TOP 10 GLOBAL'),
            leaderboard.map((item, i) => h('div', { key: i, className: 'leaderboard-item' },
              h('span', { className: 'rank' }, `#${i+1}`),
              h('span', { className: 'user-id' }, item.user_id),
              h('span', { className: 'score-pts' }, item.total_score)
            ))
          ),
          h('div', { className: 'glass-card', style: { fontSize: '13px', color: '#888', textAlign: 'center' } },
            h('p', null, 'Dica: Combos seguidos dão bônus exponencial de pontos! ✨')
          )
        )
      );
    }

    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(h(App));
    } catch (e) { 
      // Fallback for older browsers
      ReactDOM.render(h(App), document.getElementById('root'));
    }
  </script>
</body>
</html>
