<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON BLAST - Pro & Addictive</title>
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const err = `Error: ${msg}\nLine: ${lineNo}\nFile: ${url}`;
      console.error(err);
      const errorDiv = document.createElement('div');
      errorDiv.style = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:9999;font-family:monospace;word-break:break-all;';
      errorDiv.innerHTML = err.replace(/\n/g, '<br>');
      if (document.body) document.body.appendChild(errorDiv);
      return false;
    };
  </script>
  <script>
    function loadFallback(src) {
      const script = document.createElement('script');
      script.src = src; script.crossOrigin = "anonymous";
      document.head.appendChild(script);
    }
  </script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" onerror="loadFallback('/react.min.js')"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" onerror="loadFallback('/react-dom.min.js')"></script>
  <style>
    :root {
      --bg: #050505;
      --card-bg: rgba(20, 20, 30, 0.9);
      --accent: #00f2ff;
      --success: #00ff88;
      --danger: #ff0055;
      --warning: #ffaa00;
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      font-family: 'Outfit', 'Inter', sans-serif; 
      background: var(--bg); color: #fff; overflow-x: hidden; min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
    }

    .app-container {
      max-width: 1200px; margin: 0 auto; padding: 10px;
      display: flex; flex-direction: column; gap: 15px; align-items: center;
    }

    @media (min-width: 1024px) {
      .app-container { flex-direction: row; align-items: flex-start; justify-content: center; padding-top: 30px; }
    }

    .game-panel {
      background: var(--card-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 32px;
      padding: 20px; width: 100%; max-width: 450px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.8); position: relative;
    }

    .game-header { text-align: center; margin-bottom: 15px; }
    .game-header h1 {
      font-size: 30px; font-weight: 900;
      background: linear-gradient(to right, var(--accent), #7000ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -2px; text-transform: uppercase;
    }

    canvas {
      display: block; border-radius: 24px; background: rgba(0,0,0,0.5);
      border: 2px solid var(--border); cursor: pointer;
      touch-action: none; width: 100%; height: auto;
    }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
    .stat-card {
      background: var(--glass); padding: 10px; border-radius: 20px;
      text-align: center; border: 1px solid var(--border);
    }
    .stat-label { font-size: 9px; color: #888; text-transform: uppercase; font-weight: 700; }
    .stat-value { font-size: 18px; font-weight: 900; margin-top: 2px; }
    .score-pts { color: var(--success); }

    .dashboard-panel { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
    .glass-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 24px; padding: 18px; }

    .player-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .avatar { width: 40px; height: 40px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; }
    .nick-info { display: flex; flex-direction: column; }
    .nick-label { font-size: 10px; color: #888; text-transform: uppercase; }
    .nick-name { font-size: 16px; font-weight: 700; color: #fff; }

    .leaderboard-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .leaderboard-item.me { background: rgba(0, 242, 255, 0.1); border-radius: 8px; padding: 8px 10px; margin: 0 -10px; }

    .controls { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
    button {
      background: linear-gradient(to right, #2563eb, #7c3aed);
      color: white; border: none; padding: 16px; border-radius: 18px;
      font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.2s;
    }
    button:active { transform: scale(0.96); }
    button.secondary { background: var(--glass); border: 1px solid var(--border); color: #888; }
    
    .ad-placeholder {
      width: 100%; height: 60px; background: rgba(255,255,255,0.03);
      border-radius: 12px; border: 1px dashed #444; margin-top: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #555; font-size: 11px; text-transform: uppercase;
    }

    .toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 25px; border-radius: 24px; z-index: 100; text-align: center;
      font-size: 22px; font-weight: 900; text-transform: uppercase;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); border: 2px solid var(--accent);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const h = React.createElement;
    const { useState, useEffect, useRef, useCallback } = React;

    const COLORS = [
      { main: '#ff3d00', glow: 'rgba(255, 61, 0, 0.6)' },
      { main: '#00e5ff', glow: 'rgba(0, 229, 255, 0.6)' },
      { main: '#ffea00', glow: 'rgba(255, 234, 0, 0.6)' },
      { main: '#d500f9', glow: 'rgba(213, 0, 249, 0.6)' },
      { main: '#00e676', glow: 'rgba(0, 230, 118, 0.6)' }
    ];

    const GRID_SIZE = 5;
    const BLOCK_SIZE = 70;
    const CANVAS_SIZE = GRID_SIZE * BLOCK_SIZE + 20;

    const PHASES = Array.from({ length: 100 }, (_, i) => ({
      level: i + 1,
      moves: Math.max(6, 25 - Math.floor(i / 2)),
      target: 400 + (i * 600)
    }));

    class GameAudio {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); }
      play(f, t, d, v=0.2) {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, this.ctx.currentTime);
        g.gain.setValueAtTime(v, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + d);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + d);
      }
      playSwap() { this.play(300, 'sine', 0.1, 0.1); }
      playMatch(c) { this.play(400 + (c*100), 'triangle', 0.2, 0.2); }
      playError() { this.play(150, 'sawtooth', 0.2, 0.2); }
      playWin() { [500, 600, 700, 800].forEach((f, i) => setTimeout(() => this.play(f, 'sine', 0.5, 0.2), i*100)); }
    }
    const audio = new GameAudio();

    function GameCanvas({ grid, onSwap, gameState, combo }) {
      const canvasRef = useRef(null);
      const [selected, setSelected] = useState(null);
      const [shake, setShake] = useState(0);

      useEffect(() => { if (combo > 0) setShake(15); }, [combo]);

      useEffect(() => {
        const canvas = canvasRef.current; const ctx = canvas.getContext('2d');
        let frame;
        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (shake > 0) { ctx.save(); ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); setShake(s => Math.max(0, s-1.5)); }
          grid.forEach((block, i) => {
            const x = (i % GRID_SIZE) * BLOCK_SIZE + 10;
            const y = Math.floor(i / GRID_SIZE) * BLOCK_SIZE + 10;
            const c = COLORS.find(co => co.main === block.color) || COLORS[0];
            const isSel = selected && selected.idx === i;
            
            ctx.shadowBlur = isSel ? 30 : 15; ctx.shadowColor = isSel ? '#fff' : c.glow;
            ctx.fillStyle = c.main;
            const p = 8; const r = 16;
            const bx = x + p; const by = y + p;
            const bw = BLOCK_SIZE - p*2; const bh = BLOCK_SIZE - p*2;
            
            ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, r); ctx.fill();
            if (isSel) { 
              ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke(); 
              // Inner pulse
              ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fill();
            }
          });
          if (shake > 0) ctx.restore();
          frame = requestAnimationFrame(render);
        };
        render(); return () => cancelAnimationFrame(frame);
      }, [grid, selected, shake]);

      const handleAction = (clientX, clientY) => {
        audio.init(); if (gameState.gameOver) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const x = Math.floor((clientX - rect.left - 10) / BLOCK_SIZE);
        const y = Math.floor((clientY - rect.top - 10) / BLOCK_SIZE);
        const idx = y * GRID_SIZE + x;
        if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return;

        if (selected) {
          if (selected.idx === idx) { setSelected(null); return; }
          const dist = Math.abs(selected.x - x) + Math.abs(selected.y - y);
          if (dist === 1) { 
            const success = onSwap(selected.idx, idx); 
            if (!success) setShake(10);
            setSelected(null); 
          } else { 
            setSelected({ x, y, idx }); audio.playSwap(); 
          }
        } else { 
          setSelected({ x, y, idx }); audio.playSwap(); 
        }
      };

      return h('canvas', { 
        ref: canvasRef, width: CANVAS_SIZE, height: CANVAS_SIZE, 
        onMouseDown: (e) => handleAction(e.clientX, e.clientY),
        onTouchStart: (e) => { e.preventDefault(); handleAction(e.touches[0].clientX, e.touches[0].clientY); }
      });
    }

    function App() {
      const [gameState, setGameState] = useState(() => {
        const saved = localStorage.getItem('neon_v3');
        return saved ? JSON.parse(saved) : {
          phase: 1, score: 0, moves: PHASES[0].moves,
          grid: Array(25).fill(0).map(() => ({ color: COLORS[Math.floor(Math.random()*COLORS.length)].main })),
          gameOver: false, sessionStart: Date.now()
        };
      });

      const [metrics, setMetrics] = useState(() => {
        const saved = localStorage.getItem('neon_metrics_v3');
        const defaultId = 'NINJA_' + Math.random().toString(36).substr(2, 4).toUpperCase();
        return saved ? JSON.parse(saved) : { totalScore: 0, dailyStreak: 0, lastPlayDate: null, userId: defaultId };
      });

      const [leaderboard, setLeaderboard] = useState([]);
      const [combo, setCombo] = useState(0);
      const [showWin, setShowWin] = useState(false);
      const [showHelp, setShowHelp] = useState(false);

      useEffect(() => { localStorage.setItem('neon_v3', JSON.stringify(gameState)); }, [gameState]);
      useEffect(() => { localStorage.setItem('neon_metrics_v3', JSON.stringify(metrics)); }, [metrics]);

      const loadLB = async () => { try { const r = await fetch('/api/leaderboard'); const d = await r.json(); if (Array.isArray(d)) setLeaderboard(d); } catch(e){} };
      useEffect(() => { loadLB(); }, []);

      const handleSwap = (idx1, idx2) => {
        if (gameState.moves <= 0 || gameState.gameOver) return false;
        const newGrid = [...gameState.grid];
        [newGrid[idx1], newGrid[idx2]] = [newGrid[idx2], newGrid[idx1]];
        
        let cCombo = 0; let matched = true; let tMatched = 0;
        while (matched) {
          matched = false; const toRem = new Set();
          for (let i = 0; i < 25; i++) {
            const r = Math.floor(i / GRID_SIZE); const c = i % GRID_SIZE;
            if (c <= GRID_SIZE-3 && newGrid[i].color === newGrid[i+1].color && newGrid[i].color === newGrid[i+2].color) [i, i+1, i+2].forEach(ix => toRem.add(ix));
            if (r <= GRID_SIZE-3 && newGrid[i].color === newGrid[i+GRID_SIZE].color && newGrid[i].color === newGrid[i+GRID_SIZE*2].color) [i, i+GRID_SIZE, i+GRID_SIZE*2].forEach(ix => toRem.add(ix));
          }
          if (toRem.size > 0) {
            matched = true; cCombo++; tMatched += toRem.size; audio.playMatch(cCombo);
            toRem.forEach(ix => newGrid[ix] = null);
            for (let c = 0; c < GRID_SIZE; c++) {
              const col = []; for (let r = 0; r < GRID_SIZE; r++) if (newGrid[r*GRID_SIZE+c]) col.push(newGrid[r*GRID_SIZE+c]);
              while (col.length < GRID_SIZE) col.unshift({ color: COLORS[Math.floor(Math.random()*COLORS.length)].main });
              for (let r = 0; r < GRID_SIZE; r++) newGrid[r*GRID_SIZE+c] = col[r];
            }
          }
        }
        
        if (tMatched === 0) { audio.playError(); return false; }

        const nScore = gameState.score + (tMatched * 10 * cCombo);
        const nMoves = gameState.moves - 1;
        const target = PHASES[gameState.phase-1].target;
        
        let gOver = false;
        if (nScore >= target) { gOver = 'won'; audio.playWin(); setShowWin(true); setMetrics(m => ({ ...m, totalScore: m.totalScore + nScore })); }
        else if (nMoves <= 0) { gOver = 'lost'; audio.playError(); }
        
        setCombo(cCombo);
        setGameState(prev => ({ ...prev, grid: newGrid, score: nScore, moves: nMoves, gameOver: gOver }));
        if (gOver) sync(nScore, metrics.dailyStreak);
        return true;
      };

      const sync = async (s, st) => {
        const p = { user_id: metrics.userId, phase_level: gameState.phase, score: s, total_score: metrics.totalScore + s, daily_streak: st, session_time: (Date.now()-gameState.sessionStart)/1000 };
        fetch('/api/save-game', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) }).then(() => loadLB()).catch(() => {});
      };

      return h('div', { className: 'app-container' },
        h('div', { className: 'game-panel' },
          h('div', { className: 'game-header' }, h('h1', null, 'NEON BLAST')),
          h(GameCanvas, { grid: gameState.grid, onSwap: handleSwap, gameState, combo }),
          h('div', { className: 'stats-grid' },
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-label' }, 'Pontos'), h('div', { className: 'stat-value score-pts' }, gameState.score)),
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-label' }, 'Vidas'), h('div', { className: 'stat-value' }, gameState.moves)),
            h('div', { className: 'stat-card' }, h('div', { className: 'stat-label' }, 'Meta'), h('div', { className: 'stat-value' }, PHASES[gameState.phase-1].target))
          ),
          h('div', { className: 'controls' },
            gameState.gameOver === 'won' ? h('button', { onClick: () => {
              const nP = gameState.phase + 1;
              setGameState({ phase: nP, score: 0, moves: PHASES[nP-1].moves, grid: Array(25).fill(0).map(() => ({ color: COLORS[Math.floor(Math.random()*COLORS.length)].main })), gameOver: false, sessionStart: Date.now() });
              setShowWin(false);
            } }, 'PRÓXIMO NÍVEL →') : 
            h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
              h('button', { onClick: () => setGameState({ ...gameState, score: 0, moves: PHASES[gameState.phase-1].moves, grid: Array(25).fill(0).map(() => ({ color: COLORS[Math.floor(Math.random()*COLORS.length)].main })), gameOver: false }), className: 'secondary' }, 'REINICIAR FASE'),
              gameState.gameOver === 'lost' && h('button', { onClick: () => setGameState(g => ({ ...g, moves: 5, gameOver: false })), style: { background: '#d97706', color: '#000' } }, '📺 +5 JOGADAS (ADS)')
            )
          ),
          showWin && h('div', { className: 'toast' }, '✨ Nível Concluído!'),
          h('div', { className: 'ad-placeholder' }, 'Espaço para Google AdSense Banner')
        ),
        h('div', { className: 'dashboard-panel' },
          h('div', { className: 'streak-banner' }, h('div', { className: 'streak-number' }, `🔥 ${metrics.dailyStreak}`), h('div', { className: 'streak-text' }, 'DIAS SEGUIDOS')),
          h('div', { className: 'glass-card' },
            h('div', { className: 'player-profile' },
              h('div', { className: 'avatar' }, metrics.userId[0]),
              h('div', { className: 'nick-info' }, h('span', { className: 'nick-label' }, 'Seu Nickname:'), h('span', { className: 'nick-name' }, metrics.userId))
            ),
            h('h3', { style: { fontSize: '14px', color: 'var(--accent)', marginBottom: '10px' } }, '🏆 RANKING GLOBAL'),
            leaderboard.map((item, i) => h('div', { key: i, className: `leaderboard-item ${item.user_id === metrics.userId ? 'me' : ''}` },
              h('span', null, h('b', { style: { color: 'var(--accent)' } }, `#${i+1} `), item.user_id),
              h('span', { className: 'score-pts' }, item.total_score)
            ))
          ),
          h('button', { onClick: () => setShowHelp(true), className: 'secondary' }, 'COMO JOGAR')
        ),
        showHelp && h('div', { className: 'toast', style: { width: '90%', fontSize: '14px', cursor: 'pointer' }, onClick: () => setShowHelp(false) },
          h('h2', { style: { color: 'var(--accent)', marginBottom: '10px' } }, 'TUTORIAL'),
          h('p', null, '💎 Clique em 1 bloco e depois em um ADJACENTE para trocar.'),
          h('p', null, '🎯 Alinhe 3 ou mais cores iguais para pontuar.'),
          h('p', null, '💡 Trocas na diagonal não são permitidas!'),
          h('button', { style: { marginTop: '15px' } }, 'ENTENDI!')
        )
      );
    }

    const r = ReactDOM.createRoot(document.getElementById('root'));
    r.render(h(App));
  </script>
</body>
</html>
