<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEON BLAST - Mobile Perfect</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --bg: #050505;
      --card-bg: rgba(15, 15, 30, 0.98);
      --accent: #00f2ff;
      --success: #00ff88;
      --danger: #ff0055;
      --warning: #ffaa00;
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      height: 100%; overflow: hidden; background: var(--bg);
      font-family: 'Outfit', -apple-system, sans-serif;
    }

    body { 
      background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
      color: #fff; touch-action: none;
    }

    .app-container {
      width: 100%; height: 100dvh; 
      display: flex; flex-direction: column; align-items: center;
      padding: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }

    .game-panel {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px;
      padding: 15px; width: 100%; max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; gap: 10px;
    }

    .game-header h1 {
      font-size: 24px; font-weight: 900; text-align: center;
      background: linear-gradient(to right, var(--accent), #7000ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-transform: uppercase; letter-spacing: -1px;
    }

    .canvas-wrapper {
      width: 100%; aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.4); border-radius: 16px; border: 1px solid var(--border); overflow: hidden;
    }

    canvas { max-width: 100%; max-height: 100%; display: block; cursor: pointer; }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat-box { background: var(--glass); padding: 8px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
    .stat-label { font-size: 9px; color: #888; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
    .stat-value { font-size: 18px; font-weight: 900; }

    .lb-card { background: var(--glass); border-radius: 16px; padding: 12px; font-size: 12px; }
    .lb-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700; color: #666; font-size: 10px; text-transform: uppercase; }
    .lb-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .lb-row.me { color: var(--accent); font-weight: 900; background: rgba(0, 242, 255, 0.05); margin: 0 -8px; padding: 4px 8px; border-radius: 4px; }

    .btn-action {
      background: linear-gradient(135deg, #2563eb, #7c3aed); color: white;
      border: none; padding: 14px; border-radius: 16px; font-size: 15px; font-weight: 800;
      width: 100%; cursor: pointer; transition: 0.2s;
    }
    .btn-action:active { transform: scale(0.96); }
    .btn-action.secondary { background: var(--glass); border: 1px solid var(--border); color: #888; }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-content { background: var(--card-bg); border-radius: 24px; padding: 25px; width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--border); }

    .ad-banner { width: 100%; height: 50px; background: rgba(255,255,255,0.02); border-radius: 10px; border: 1px dashed #333; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #444; }

    /* For very small screens */
    @media (max-height: 700px) {
      .game-panel { gap: 8px; }
      .stat-value { font-size: 16px; }
      .lb-card { display: none; } /* Hide leaderboard on tiny screens to save space */
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const h = React.createElement;
    const { useState, useEffect, useRef } = React;

    const COLORS = [
      { main: '#ff3d00', glow: 'rgba(255, 61, 0, 0.6)' },
      { main: '#00e5ff', glow: 'rgba(0, 229, 255, 0.6)' },
      { main: '#ffea00', glow: 'rgba(255, 234, 0, 0.6)' },
      { main: '#d500f9', glow: 'rgba(213, 0, 249, 0.6)' },
      { main: '#00e676', glow: 'rgba(0, 230, 118, 0.6)' }
    ];

    const GRID_SIZE = 5;
    const DESIGN_BLOCK_SIZE = 70;
    const DESIGN_CANVAS_SIZE = GRID_SIZE * DESIGN_BLOCK_SIZE + 20;

    class Sound {
      constructor() { this.c = null; }
      init() { if(!this.c) this.c = new (window.AudioContext || window.webkitAudioContext)(); if(this.c.state === 'suspended') this.c.resume(); }
      p(f, t, d, v=0.2) {
        if(!this.c) return;
        const o = this.c.createOscillator(); const g = this.c.createGain();
        o.type = t; o.frequency.setValueAtTime(f, this.c.currentTime);
        g.gain.setValueAtTime(v, this.c.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.c.currentTime + d);
        o.connect(g); g.connect(this.c.destination); o.start(); o.stop(this.c.currentTime + d);
      }
      swap() { this.p(350, 'sine', 0.1, 0.1); }
      match(c) { this.p(450 + (c*120), 'triangle', 0.3, 0.2); }
      err() { this.p(140, 'sawtooth', 0.2, 0.2); }
      win() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => this.p(f, 'sine', 0.5, 0.2), i*100)); }
    }
    const audio = new Sound();

    function App() {
      const [state, setState] = useState(() => {
        const saved = localStorage.getItem('neon_v6');
        const defaultId = 'PLAYER_' + Math.random().toString(36).substr(2, 4).toUpperCase();
        return saved ? JSON.parse(saved) : {
          level: 1, score: 0, moves: 25,
          grid: Array(25).fill(0).map(() => ({ color: COLORS[Math.floor(Math.random()*COLORS.length)].main })),
          isProcessing: false, userId: defaultId
        };
      });

      const [selected, setSelected] = useState(null);
      const [lb, setLb] = useState([]);
      const [modal, setModal] = useState(null);
      const canvasRef = useRef(null);
      const dragRef = useRef(null);

      useEffect(() => { localStorage.setItem('neon_v6', JSON.stringify(state)); }, [state]);
      useEffect(() => { fetch('/api/leaderboard').then(r => r.json()).then(d => setLb(d)).catch(() => {}); }, [state.level]);

      useEffect(() => {
        const canvas = canvasRef.current; if(!canvas) return;
        const ctx = canvas.getContext('2d');
        let frame;
        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          state.grid.forEach((b, i) => {
            const x = (i % GRID_SIZE) * DESIGN_BLOCK_SIZE + 10;
            const y = Math.floor(i / GRID_SIZE) * DESIGN_BLOCK_SIZE + 10;
            const c = COLORS.find(co => co.main === b.color) || COLORS[0];
            const isS = selected && selected.idx === i;
            ctx.shadowBlur = isS ? 30 : 15; ctx.shadowColor = isS ? '#fff' : c.glow;
            ctx.fillStyle = c.main;
            const p = 8; const r = 18;
            ctx.beginPath(); ctx.roundRect(x+p, y+p, DESIGN_BLOCK_SIZE-p*2, DESIGN_BLOCK_SIZE-p*2, r); ctx.fill();
            if (isS) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke(); }
          });
          frame = requestAnimationFrame(draw);
        };
        draw(); return () => cancelAnimationFrame(frame);
      }, [state.grid, selected]);

      const getGridPos = (clientX, clientY) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const scale = DESIGN_CANVAS_SIZE / rect.width;
        const x = Math.floor(((clientX - rect.left) * scale - 10) / DESIGN_BLOCK_SIZE);
        const y = Math.floor(((clientY - rect.top) * scale - 10) / DESIGN_BLOCK_SIZE);
        if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return null;
        return { x, y, idx: y * GRID_SIZE + x };
      };

      const handleDown = (e) => {
        if (state.isProcessing || modal) return;
        audio.init();
        const pos = getGridPos(e.clientX || (e.touches && e.touches[0].clientX), e.clientY || (e.touches && e.touches[0].clientY));
        if (!pos) return;
        if (selected) {
          const dist = Math.abs(selected.x - pos.x) + Math.abs(selected.y - pos.y);
          if (dist === 1) { processMove(selected.idx, pos.idx); setSelected(null); }
          else { setSelected(pos); audio.swap(); }
        } else { setSelected(pos); audio.swap(); dragRef.current = pos; }
      };

      const handleMove = (e) => {
        if (!dragRef.current || state.isProcessing) return;
        const pos = getGridPos(e.clientX || (e.touches && e.touches[0].clientX), e.clientY || (e.touches && e.touches[0].clientY));
        if (!pos) return;
        const dist = Math.abs(dragRef.current.x - pos.x) + Math.abs(dragRef.current.y - pos.y);
        if (dist === 1) { processMove(dragRef.current.idx, pos.idx); dragRef.current = null; setSelected(null); }
      };

      const processMove = async (idx1, idx2) => {
        setState(s => ({ ...s, isProcessing: true }));
        const newGrid = [...state.grid];
        [newGrid[idx1], newGrid[idx2]] = [newGrid[idx2], newGrid[idx1]];
        let matches = findMatches(newGrid);
        if (matches.size === 0) { audio.err(); setState(s => ({ ...s, isProcessing: false })); return; }
        audio.swap();
        let totalScore = state.score; let combo = 0;
        while (matches.size > 0) {
          combo++; totalScore += matches.size * 10 * combo; audio.match(combo);
          matches.forEach(idx => newGrid[idx] = null);
          for (let c = 0; c < GRID_SIZE; c++) {
            let col = [];
            for (let r = 0; r < GRID_SIZE; r++) if (newGrid[r*GRID_SIZE+c]) col.push(newGrid[r*GRID_SIZE+c]);
            while (col.length < GRID_SIZE) col.unshift({ color: COLORS[Math.floor(Math.random()*COLORS.length)].main });
            for (let r = 0; r < GRID_SIZE; r++) newGrid[r*GRID_SIZE+c] = col[r];
          }
          setState(s => ({ ...s, grid: [...newGrid], score: totalScore }));
          await new Promise(r => setTimeout(r, 250));
          matches = findMatches(newGrid);
        }
        const target = 500 + (state.level * 1000);
        const nextMoves = state.moves - 1;
        if (totalScore >= target) { audio.win(); setModal('WIN'); sync(totalScore); }
        else if (nextMoves <= 0) { audio.err(); setModal('LOSE'); }
        setState(s => ({ ...s, score: totalScore, moves: nextMoves, isProcessing: false }));
      };

      const findMatches = (grid) => {
        const matches = new Set();
        for (let i = 0; i < 25; i++) {
          const r = Math.floor(i / GRID_SIZE); const c = i % GRID_SIZE;
          if (c <= GRID_SIZE-3 && grid[i] && grid[i+1] && grid[i+2] && grid[i].color === grid[i+1].color && grid[i].color === grid[i+2].color) [i, i+1, i+2].forEach(ix => matches.add(ix));
          if (r <= GRID_SIZE-3 && grid[i] && grid[i+GRID_SIZE] && grid[i+GRID_SIZE*2] && grid[i].color === grid[i+GRID_SIZE].color && grid[i].color === grid[i+GRID_SIZE*2].color) [i, i+GRID_SIZE, i+GRID_SIZE*2].forEach(ix => matches.add(ix));
        }
        return matches;
      };

      const sync = (s) => {
        const p = { user_id: state.userId, phase_level: state.level, score: s, total_score: s, daily_streak: 1, session_time: 10 };
        fetch('/api/save-game', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) });
      };

      return h('div', { className: 'app-container' },
        h('div', { className: 'game-panel' },
          h('div', { className: 'game-header' }, h('h1', null, 'NEON BLAST')),
          h('div', { className: 'canvas-wrapper' },
            h('canvas', { 
              ref: canvasRef, width: DESIGN_CANVAS_SIZE, height: DESIGN_CANVAS_SIZE,
              onMouseDown: handleDown, onMouseMove: handleMove, onMouseUp: () => dragRef.current = null,
              onTouchStart: handleDown, onTouchMove: (e) => { e.preventDefault(); handleMove(e); }, onTouchEnd: () => dragRef.current = null
            })
          ),
          h('div', { className: 'stats-row' },
            h('div', { className: 'stat-box' }, h('div', { className: 'stat-label' }, 'Score'), h('div', { className: 'stat-value', style: { color: 'var(--success)' } }, state.score)),
            h('div', { className: 'stat-box' }, h('div', { className: 'stat-label' }, 'Vidas'), h('div', { className: 'stat-value', style: { color: state.moves < 5 ? 'var(--danger)' : 'var(--warning)' } }, state.moves)),
            h('div', { className: 'stat-box' }, h('div', { className: 'stat-label' }, 'Meta'), h('div', { className: 'stat-value', style: { color: 'var(--accent)' } }, 500 + state.level * 1000))
          ),
          h('div', { className: 'lb-card' },
            h('div', { className: 'lb-header' }, h('span', null, 'Ranking Global'), h('span', null, 'ID: ' + state.userId)),
            lb.slice(0, 3).map((item, i) => h('div', { key: i, className: `lb-row ${item.user_id === state.userId ? 'me' : ''}` }, h('span', null, `#${i+1} ${item.user_id}`), h('span', null, item.total_score)))
          ),
          h('div', { className: 'ad-banner' }, 'GOOGLE ADS BANNER'),
          h('button', { className: 'btn-action secondary', onClick: () => setModal('HELP') }, 'COMO JOGAR')
        ),
        modal === 'WIN' && h('div', { className: 'modal' }, h('div', { className: 'modal-content' }, h('h2', { style: { color: 'var(--success)' } }, 'BOA!'), h('p', { style: { margin: '15px 0' } }, `Nível ${state.level} Completo!`), h('button', { className: 'btn-action', onClick: () => { const nL = state.level + 1; setState({ ...state, level: nL, score: 0, moves: 25, grid: Array(25).fill(0).map(() => ({ color: COLORS[Math.floor(Math.random()*COLORS.length)].main })), isProcessing: false }); setModal(null); } }, 'PRÓXIMA FASE'))),
        modal === 'LOSE' && h('div', { className: 'modal' }, h('div', { className: 'modal-content' }, h('h2', { style: { color: 'var(--danger)' } }, 'FIM!'), h('p', { style: { margin: '15px 0' } }, 'Acabaram as jogadas.'), h('button', { className: 'btn-action', onClick: () => { setState({ ...state, score: 0, moves: 25, grid: Array(25).fill(0).map(() => ({ color: COLORS[Math.floor(Math.random()*COLORS.length)].main })), isProcessing: false }); setModal(null); } }, 'RECOMEÇAR'))),
        modal === 'HELP' && h('div', { className: 'modal', onClick: () => setModal(null) }, h('div', { className: 'modal-content' }, h('h2', null, 'TUTORIAL'), h('p', { style: { margin: '20px 0', fontSize: '15px' } }, 'Arraste ou toque nos blocos para alinhar 3 cores iguais!'), h('button', { className: 'btn-action', onClick: () => setModal(null) }, 'ENTENDI')))
      );
    }
    const r = ReactDOM.createRoot(document.getElementById('root'));
    r.render(h(App));
  </script>
</body>
</html>
