<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEON BLAST - Ultimate Addictive</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --bg: #030303;
      --card-bg: rgba(10, 10, 20, 0.98);
      --accent: #00f2ff;
      --success: #00ff88;
      --danger: #ff0055;
      --warning: #ffaa00;
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Outfit', sans-serif; }
    
    html, body { height: 100%; overflow: hidden; background: var(--bg); }
    body { 
      background: radial-gradient(circle at 50% 50%, #151525 0%, #030303 100%);
      color: #fff; touch-action: none;
    }

    .app-container {
      width: 100%; height: 100dvh; 
      display: flex; flex-direction: column; align-items: center;
      padding: 10px; overflow-y: auto;
    }

    .game-panel {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 28px;
      padding: 12px; width: 100%; max-width: 420px;
      box-shadow: 0 0 100px rgba(0, 242, 255, 0.1);
      display: flex; flex-direction: column; gap: 8px;
    }

    .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; }
    .logo { font-size: 20px; font-weight: 900; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nick-badge { font-size: 11px; color: var(--accent); background: rgba(0,242,255,0.1); padding: 4px 10px; border-radius: 50px; border: 1px solid rgba(0,242,255,0.3); font-weight: 700; }
    .streak-fire { font-size: 12px; color: var(--warning); font-weight: 900; }

    .progress-container { width: 100%; height: 12px; background: rgba(255,255,255,0.05); border-radius: 50px; overflow: hidden; border: 1px solid var(--border); position: relative; }
    .progress-bar { height: 100%; background: linear-gradient(to right, var(--accent), var(--success)); transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .progress-glow { position: absolute; top: 0; right: 0; width: 20px; height: 100%; background: #fff; filter: blur(5px); opacity: 0.5; }

    .canvas-wrapper { width: 100%; aspect-ratio: 1/1; position: relative; border-radius: 20px; overflow: hidden; border: 2px solid var(--border); background: #000; }
    canvas { width: 100%; height: 100%; display: block; }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .stat-box { background: var(--glass); padding: 8px; border-radius: 14px; text-align: center; border: 1px solid var(--border); }
    .stat-label { font-size: 8px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .stat-value { font-size: 16px; font-weight: 900; }

    .btn-main {
      background: linear-gradient(135deg, #00f2ff, #7000ff); color: white;
      border: none; padding: 14px; border-radius: 18px; font-size: 14px; font-weight: 800;
      width: 100%; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3);
    }
    .btn-main.secondary { background: var(--glass); border: 1px solid var(--border); color: #888; box-shadow: none; }

    .lb-mini { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 10px; font-size: 11px; }
    .lb-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .lb-row.me { color: var(--accent); font-weight: 900; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
    .modal-content { background: var(--card-bg); border-radius: 32px; padding: 30px; width: 100%; max-width: 360px; text-align: center; border: 1px solid var(--border); position: relative; }
    
    .rule-item { display: flex; align-items: center; gap: 15px; text-align: left; margin-bottom: 15px; font-size: 14px; color: #ccc; }
    .rule-icon { width: 40px; height: 40px; background: var(--glass); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid var(--border); }

    .combo-text { position: absolute; pointer-events: none; color: #fff; font-weight: 900; font-size: 24px; text-shadow: 0 0 20px var(--accent); animation: floatUp 0.8s ease-out forwards; z-index: 100; }
    @keyframes floatUp { 0% { transform: scale(0.5); opacity: 0; } 20% { transform: scale(1.2); opacity: 1; } 100% { transform: translateY(-50px) scale(1); opacity: 0; } }

    @media (max-height: 650px) { .lb-mini { display: none; } .game-panel { gap: 6px; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const h = React.createElement;
    const { useState, useEffect, useRef } = React;

    const COLORS = [
      { m: '#ff3d00', g: 'rgba(255, 61, 0, 0.6)' },
      { m: '#00e5ff', g: 'rgba(0, 229, 255, 0.6)' },
      { m: '#ffea00', g: 'rgba(255, 234, 0, 0.6)' },
      { m: '#d500f9', g: 'rgba(213, 0, 249, 0.6)' },
      { m: '#00e676', g: 'rgba(0, 230, 118, 0.6)' }
    ];

    const GRID = 5;
    const SIZE = 70;
    const CANVAS = GRID * SIZE + 20;

    class AudioSfx {
      constructor() { this.c = null; }
      init() { if(!this.c) this.c = new (window.AudioContext || window.webkitAudioContext)(); if(this.c.state === 'suspended') this.c.resume(); }
      p(f, t, d, v=0.2) {
        if(!this.c) return;
        const o = this.c.createOscillator(); const g = this.c.createGain();
        o.type = t; o.frequency.setValueAtTime(f, this.c.currentTime);
        g.gain.setValueAtTime(v, this.c.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.c.currentTime + d);
        o.connect(g); g.connect(this.c.destination); o.start(); o.stop(this.c.currentTime + d);
      }
      sw() { this.p(350, 'sine', 0.1, 0.1); }
      mt(c) { this.p(400 + (c*150), 'triangle', 0.3, 0.2); }
      er() { this.p(150, 'sawtooth', 0.2, 0.2); }
      wn() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => this.p(f, 'sine', 0.4, 0.2), i*80)); }
    }
    const sfx = new AudioSfx();

    function App() {
      const [st, setSt] = useState(() => {
        const s = localStorage.getItem('neon_v7');
        const id = 'Ninja_' + Math.random().toString(36).substr(2, 4).toUpperCase();
        return s ? JSON.parse(s) : { lvl: 1, sc: 0, mv: 25, gd: Array(25).fill(0).map(() => ({ c: COLORS[Math.floor(Math.random()*5)].m })), id, pr: false };
      });

      const [sel, setSel] = useState(null);
      const [lb, setLb] = useState([]);
      const [md, setMd] = useState('HELP');
      const [cbTxt, setCbTxt] = useState(null);
      const cvRef = useRef(null);
      const drRef = useRef(null);
      const ptRef = useRef([]); // Particles

      useEffect(() => { localStorage.setItem('neon_v7', JSON.stringify(st)); }, [st]);
      useEffect(() => { fetch('/api/leaderboard').then(r => r.json()).then(d => setLb(d)).catch(()=>{}); }, [st.lvl]);

      // Particles & Drawing Loop
      useEffect(() => {
        const cv = cvRef.current; if(!cv) return;
        const ctx = cv.getContext('2d');
        let fr;
        const draw = () => {
          ctx.clearRect(0, 0, cv.width, cv.height);
          // Draw Grid
          st.gd.forEach((b, i) => {
            const x = (i % GRID) * SIZE + 10;
            const y = Math.floor(i / GRID) * SIZE + 10;
            const c = COLORS.find(co => co.m === b.c) || COLORS[0];
            const isS = sel && sel.idx === i;
            ctx.shadowBlur = isS ? 30 : 15; ctx.shadowColor = isS ? '#fff' : c.g;
            ctx.fillStyle = c.m;
            ctx.beginPath(); ctx.roundRect(x+8, y+8, SIZE-16, SIZE-16, 18); ctx.fill();
            if (isS) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke(); }
          });
          // Draw Particles
          ptRef.current = ptRef.current.filter(p => p.l > 0);
          ptRef.current.forEach(p => {
            ctx.shadowBlur = 10; ctx.shadowColor = p.c; ctx.fillStyle = p.c;
            ctx.fillRect(p.x, p.y, p.s, p.s);
            p.x += p.vx; p.y += p.vy; p.l -= 0.05;
          });
          fr = requestAnimationFrame(draw);
        };
        draw(); return () => cancelAnimationFrame(fr);
      }, [st.gd, sel]);

      const createPts = (idx, c) => {
        const x = (idx % GRID) * SIZE + SIZE/2;
        const y = Math.floor(idx / GRID) * SIZE + SIZE/2;
        for(let i=0; i<8; i++) ptRef.current.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, s: Math.random()*5+2, c, l: 1 });
      };

      const getP = (cx, cy) => {
        const r = cvRef.current.getBoundingClientRect();
        const sc = CANVAS / r.width;
        const x = Math.floor(((cx - r.left) * sc - 10) / SIZE);
        const y = Math.floor(((cy - r.top) * sc - 10) / SIZE);
        if (x < 0 || x >= GRID || y < 0 || y >= GRID) return null;
        return { x, y, idx: y * GRID + x };
      };

      const dn = (e) => {
        if (st.pr || md) return;
        sfx.init();
        const p = getP(e.clientX || (e.touches && e.touches[0].clientX), e.clientY || (e.touches && e.touches[0].clientY));
        if (!p) return;
        if (sel) {
          const d = Math.abs(sel.x - p.x) + Math.abs(sel.y - p.y);
          if (d === 1) { mv(sel.idx, p.idx); setSel(null); }
          else { setSel(p); sfx.sw(); }
        } else { setSel(p); sfx.sw(); drRef.current = p; }
      };

      const mov = (e) => {
        if (!drRef.current || st.pr) return;
        const p = getP(e.clientX || (e.touches && e.touches[0].clientX), e.clientY || (e.touches && e.touches[0].clientY));
        if (!p) return;
        const d = Math.abs(drRef.current.x - p.x) + Math.abs(drRef.current.y - p.y);
        if (d === 1) { mv(drRef.current.idx, p.idx); drRef.current = null; setSel(null); }
      };

      const mv = async (i1, i2) => {
        setSt(s => ({ ...s, pr: true }));
        const nG = [...st.gd]; [nG[i1], nG[i2]] = [nG[i2], nG[i1]];
        let mts = find(nG);
        if (mts.size === 0) { sfx.er(); setSt(s => ({ ...s, pr: false })); return; }
        
        sfx.sw();
        let sc = st.sc; let cb = 0;
        while (mts.size > 0) {
          cb++; sc += mts.size * 10 * cb; sfx.mt(cb);
          setCbTxt({ x: 150, y: 150, t: `COMBO X${cb}` });
          setTimeout(() => setCbTxt(null), 800);
          
          mts.forEach(ix => { createPts(ix, nG[ix].c); nG[ix] = null; });
          for (let c = 0; c < GRID; c++) {
            let col = []; for (let r = 0; r < GRID; r++) if (nG[r*GRID+c]) col.push(nG[r*GRID+c]);
            while (col.length < GRID) col.unshift({ c: COLORS[Math.floor(Math.random()*5)].m });
            for (let r = 0; r < GRID; r++) nG[r*GRID+c] = col[r];
          }
          setSt(s => ({ ...s, gd: [...nG], sc }));
          await new Promise(r => setTimeout(r, 250));
          mts = find(nG);
        }
        
        const tgt = 500 + (st.lvl * 800);
        const nMV = st.mv - 1;
        if (sc >= tgt) { sfx.wn(); setMd('WIN'); sy(sc); }
        else if (nMV <= 0) { sfx.er(); setMd('LOSE'); }
        setSt(s => ({ ...s, sc, mv: nMV, pr: false }));
      };

      const find = (g) => {
        const m = new Set();
        for (let i = 0; i < 25; i++) {
          const r = Math.floor(i / GRID); const c = i % GRID;
          if (c <= GRID-3 && g[i] && g[i+1] && g[i+2] && g[i].c === g[i+1].c && g[i].c === g[i+2].c) [i, i+1, i+2].forEach(ix => m.add(ix));
          if (r <= GRID-3 && g[i] && g[i+GRID] && g[i+GRID*2] && g[i].c === g[i+GRID].c && g[i].c === g[i+GRID*2].c) [i, i+GRID, i+GRID*2].forEach(ix => m.add(ix));
        }
        return m;
      };

      const sy = (s) => {
        const p = { user_id: st.id, phase_level: st.lvl, score: s, total_score: s, daily_streak: 1, session_time: 10 };
        fetch('/api/save-game', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) });
      };

      const tgt = 500 + (st.lvl * 800);
      const prog = Math.min(100, (st.sc / tgt) * 100);

      return h('div', { className: 'app-container' },
        h('div', { className: 'game-panel' },
          h('div', { className: 'header-bar' }, h('span', { className: 'logo' }, 'NEON BLAST'), h('span', { className: 'nick-badge' }, st.id)),
          h('div', { className: 'header-bar' }, h('span', { className: 'streak-fire' }, `\uD83D\uDD25 LEVEL ${st.lvl}`), h('span', { style: { fontSize: '11px', color: '#888' } }, `BEST: ${st.best || 0}`)),
          h('div', { className: 'progress-container' }, h('div', { className: 'progress-bar', style: { width: `${prog}%` } }, h('div', { className: 'progress-glow' }))),
          h('div', { className: 'canvas-wrapper' },
            h('canvas', { 
              ref: cvRef, width: CANVAS, height: CANVAS,
              onMouseDown: dn, onMouseMove: mov, onMouseUp: () => drRef.current = null,
              onTouchStart: dn, onTouchMove: (e) => { e.preventDefault(); mov(e); }, onTouchEnd: () => drRef.current = null
            }),
            cbTxt && h('div', { className: 'combo-text', style: { left: cbTxt.x, top: cbTxt.y } }, cbTxt.t)
          ),
          h('div', { className: 'stats-row' },
            h('div', { className: 'stat-box' }, h('div', { className: 'stat-label' }, 'Score'), h('div', { className: 'stat-value', style: { color: 'var(--success)' } }, st.sc)),
            h('div', { className: 'stat-box' }, h('div', { className: 'stat-label' }, 'Moves'), h('div', { className: 'stat-value', style: { color: st.mv < 5 ? 'var(--danger)' : 'var(--warning)' } }, st.mv)),
            h('div', { className: 'stat-box' }, h('div', { className: 'stat-label' }, 'Goal'), h('div', { className: 'stat-value' }, tgt))
          ),
          h('div', { className: 'lb-mini' },
            h('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: '5px', opacity: 0.5 } }, h('span', null, st.id), h('span', null, 'RANKING')),
            lb.slice(0, 3).map((it, i) => h('div', { key: i, className: `lb-row ${it.user_id === st.id ? 'me' : ''}` }, h('span', null, `#${i+1} ${it.user_id}`), h('span', null, it.total_score)))
          ),
          h('button', { className: 'btn-main secondary', onClick: () => setMd('HELP') }, 'COMO JOGAR')
        ),
        md === 'WIN' && h('div', { className: 'modal' }, h('div', { className: 'modal-content' }, h('h1', { style: { color: 'var(--success)', fontSize: '32px' } }, 'BÔNUS!'), h('p', { style: { margin: '20px 0', fontSize: '18px' } }, `Nível ${st.lvl} concluído!`), h('button', { className: 'btn-main', onClick: () => { const nL = st.lvl + 1; setSt({ ...st, lvl: nL, sc: 0, mv: 25, gd: Array(25).fill(0).map(() => ({ c: COLORS[Math.floor(Math.random()*5)].m })), pr: false }); setMd(null); } }, 'PRÓXIMA FASE →'))),
        md === 'LOSE' && h('div', { className: 'modal' }, h('div', { className: 'modal-content' }, h('h1', { style: { color: 'var(--danger)', fontSize: '32px' } }, 'PERDEU!'), h('p', { style: { margin: '20px 0' } }, 'Você ficou sem jogadas.'), h('button', { className: 'btn-main', onClick: () => { setSt({ ...st, sc: 0, mv: 25, gd: Array(25).fill(0).map(() => ({ c: COLORS[Math.floor(Math.random()*5)].m })), pr: false }); setMd(null); } }, 'RECOMEÇAR'))),
        md === 'HELP' && h('div', { className: 'modal' }, h('div', { className: 'modal-content' }, 
          h('h2', { style: { color: '#00f2ff', marginBottom: '25px' } }, 'COMO JOGAR'),
          h('div', { className: 'rule-item' }, h('div', { className: 'rule-icon' }, '💎'), h('div', null, h('b', null, 'Combine 3:'), h('p', { style: { fontSize: '12px' } }, 'Troque ou arraste blocos para alinhar 3 cores.'))),
          h('div', { className: 'rule-item' }, h('div', { className: 'rule-icon' }, '🔥'), h('div', null, h('b', null, 'Super Combos:'), h('p', { style: { fontSize: '12px' } }, 'Combine 4 ou mais para ganhar bônus gigantes.'))),
          h('div', { className: 'rule-item' }, h('div', { className: 'rule-icon' }, '🎯'), h('div', null, h('b', null, 'Meta:'), h('p', { style: { fontSize: '12px' } }, 'Encha a barra de progresso antes das jogadas acabarem.'))),
          h('button', { className: 'btn-main', style: { marginTop: '10px' }, onClick: () => setMd(null) }, 'ESTOU PRONTO!')
        ))
      );
    }
    const r = ReactDOM.createRoot(document.getElementById('root'));
    r.render(h(App));
  </script>
</body>
</html>
